name: Release

on:
  push:
    tags:
      - "v*"

# Creating a release with GITHUB_TOKEN needs this; the default is read-only.
permissions:
  contents: write

jobs:
  # The check runs here rather than inside each build leg. Tags never had it —
  # test.yml only watches main and PRs — so a tag was the first place a broken
  # build could appear, and one leg failing used to cancel the other two. The
  # browser tests need Chrome, which only the x64 and Windows runners have.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
            ext: zip
            bin: .\dist\app.exe
          - os: ubuntu-latest
            asset: linux-x64
            ext: tar.gz
            bin: ./dist/app
          - os: ubuntu-24.04-arm
            asset: linux-arm64
            ext: tar.gz
            bin: ./dist/app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # Compile only. fmt, lint, typecheck and the browser tests belong to the
      # test job above, and Chrome lives on neither the arm64 runner nor the
      # compile step. No --target: each runner builds for itself, so this is the
      # step that produces the asset.
      - run: bun run compile

      # NTFS stores no Unix mode bits, so this cannot be assumed from the compile.
      # It goes before the smoke test on purpose, so "./dist/app help" below is
      # itself the proof that the binary arrived executable.
      - name: executable bit
        if: startsWith(matrix.asset, 'linux-')
        run: |
          chmod +x dist/app
          test -x dist/app

      # A bundle that cannot print its own help text is not shippable.
      - run: ${{ matrix.bin }} help

      # Flat, because the binary reads .env from its working directory, so the
      # user must end up with the binary and .env side by side. Never ship a real
      # .env. tar for Linux because it is the only one of the two that carries the
      # executable bit to the user's machine.
      - name: package (windows)
        if: matrix.asset == 'windows-x64'
        run: Compress-Archive -Path dist\app.exe, .env.example, LICENSE, README.md -DestinationPath "sippol-integrator-${{ github.ref_name }}-windows-x64.zip"

      - name: package (linux)
        if: startsWith(matrix.asset, 'linux-')
        run: tar -czf "sippol-integrator-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz" dist/app .env.example LICENSE README.md

      # Handed to the publish job, because two builds racing two gh release create
      # calls would leave a release with one asset instead of two. If the archive
      # step silently produced nothing, error rather than publish half a release.
      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.asset }}
          path: sippol-integrator-${{ github.ref_name }}-${{ matrix.asset }}.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh needs a git repo to resolve the tag and to draft notes against the
      # previous one, and the workspace starts empty otherwise. Full history so
      # --generate-notes can compare v0.2.0 → v0.3.0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist

      # gh is preinstalled on the runner, so no third-party release action is
      # needed. Deliberately not idempotent: re-running a failed publish finds the
      # release already there and stops, instead of overwriting assets.
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/*.tar.gz --generate-notes
