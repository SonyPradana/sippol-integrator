name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: check (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # fmt:check, lint, typecheck, test, compile. The tests drive a real headless
      # Chrome against src/fixture/, which the runner already has.
      - run: bun run check

  windows:
    name: check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # The release asset is a Windows binary built on this runner, so this is the
      # platform that actually matters. On Linux a cross-compile would never catch
      # a Windows-only breakage.
      - run: bun run check
